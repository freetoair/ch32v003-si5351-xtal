; https://docs.platformio.org/page/projectconf.html

[env:genericCH32V003J4M6]
platform = ch32v
board = genericCH32V003J4M6
framework = arduino
monitor_speed = 115200
; The Etherkit Si5351 library is no longer used: its init() probes the bus with
; an empty transmission, which this core's TwoWire always reports as a failure,
; so it never got past its own presence check. src/main.cpp drives the Si5351
; directly over a bounded I2C path instead. To bring the library back, restore:
;   lib_deps = etherkit/Etherkit Si5351@^2.2.0
;   lib_extra_dirs = /home/nb/arduino/arduino-1.8.19/portable/sketchbook/libraries
